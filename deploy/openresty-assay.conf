# Assay 平台入口（安装到 /opt/1panel/www/conf.d/assay.conf）
# 手工管理文件，勿通过 1Panel 面板编辑；蓝绿切流只改同目录 assay-upstream.conf。
# 反代细节在 assay-proxy.inc，两个 server 块共用。

# CDN 回源时若已带 X-Forwarded-Proto 就沿用，否则回落 $scheme。
# 不能无条件用 $scheme：回源走明文时它恒为 http，会把真实客户端协议冲掉，
# 导致后端判成明文连接、不下发 Secure Cookie。
map $http_x_forwarded_proto $assay_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# ① 明文 8321：管理员兜底直连通道（CDN 故障时仍可登录，此时 Cookie 不带 Secure 才发得出去）
server {
    listen 8321;
    include /usr/local/openresty/nginx/conf/conf.d/assay-proxy.inc;
}

# ② HTTPS 443：EdgeOne 回源走这里，边缘到源站这一段也加密。
# 不写 default_server —— 同机 443 上还有别的站，未匹配 SNI 的请求不该落到 assay。
# 证书由 acme.sh DNS-01 签发并自动续期（续期钩子会 reload OpenResty），
# 放在 /www/assay-ssl 而非 1Panel 托管的 /www/sites/*，避免面板逻辑与手工配置互相覆盖。
server {
    listen 443 ssl;
    server_name assay.synvoe.com;

    ssl_certificate     /www/assay-ssl/fullchain.pem;
    ssl_certificate_key /www/assay-ssl/privkey.pem;

    include /usr/local/openresty/nginx/conf/conf.d/assay-proxy.inc;
}

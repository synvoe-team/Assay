# Assay 蓝绿 upstream include（安装到 netcup 宿主 nginx 的 /etc/nginx/conf.d/assay-upstream.conf）
# 宿主 nginx.conf 的 http{} 已 `include /etc/nginx/conf.d/*.conf;`，故此文件全局生效。
# 由 deploy-receive.sh 在蓝绿切流时改写 server 行并 `nginx -t && systemctl reload nginx`。
# 端口约定：blue=18820 / green=18821（容器发布在 127.0.0.1，仅本机可达）。
upstream assay_backend {
    server 127.0.0.1:18820;
}

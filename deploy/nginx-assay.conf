# Assay LLM 渠道检测平台
#   - assay.yukihoapi.com：Cloudflare 代理 → 本机 nginx → assay_backend（蓝绿 upstream）
#   - assay.synvoe.com  ：EdgeOne CDN 回源 → 本机 nginx → assay_backend
#                          （EdgeOne 边缘证书自带；回源 UpstreamCertificateVerify=disable，
#                           故本机复用 yukihoapi 证书即可，CN 不匹配对回源无影响）
# upstream assay_backend 由 /etc/nginx/conf.d/assay-upstream.conf 定义，
# 部署脚本 deploy-receive.sh 蓝绿切流时改写该 include 并 reload。
server {
    listen 80;
    server_name assay.yukihoapi.com assay.synvoe.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name assay.yukihoapi.com;

    underscores_in_headers on;
    large_client_header_buffers 8 64k;
    client_max_body_size 50m;

    ssl_certificate /etc/letsencrypt/live/assay.yukihoapi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/assay.yukihoapi.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:ASSAY_SSL:10m;
    ssl_session_timeout 10m;

    access_log /var/log/nginx/assay-access.log;
    error_log  /var/log/nginx/assay-error.log;

    location / {
        proxy_pass http://assay_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;            # 任务事件 SSE 流式
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
    }
}

# EdgeOne 回源入口（assay.synvoe.com）。回源为 HTTPS:443、Host: assay.synvoe.com。
server {
    listen 443 ssl;
    http2 on;
    server_name assay.synvoe.com;

    underscores_in_headers on;
    large_client_header_buffers 8 64k;
    client_max_body_size 50m;

    # EdgeOne 回源不校验源站证书（VerificationMode=disable），此处复用 yukihoapi 证书。
    ssl_certificate /etc/letsencrypt/live/assay.yukihoapi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/assay.yukihoapi.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:ASSAY_SSL:10m;
    ssl_session_timeout 10m;

    access_log /var/log/nginx/assay-synvoe-access.log;
    error_log  /var/log/nginx/assay-synvoe-error.log;

    location / {
        proxy_pass http://assay_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
    }
}

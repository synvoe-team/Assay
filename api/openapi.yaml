openapi: 3.0.3
info:
  title: Assay API
  description: LLM 渠道检测平台 API。本文件是前后端契约的唯一真相源（契约优先）。
  version: 0.14.0
servers:
  - url: /api
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: 健康检查
      tags: [system]
      responses:
        "200":
          description: 服务正常
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /version:
    get:
      operationId: getVersion
      summary: 当前服务版本
      tags: [system]
      responses:
        "200":
          description: 正在运行的服务版本号
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionInfo"
  /auth/login:
    post:
      operationId: login
      summary: 登录，成功后通过 HttpOnly Cookie 建立会话
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "204":
          description: 登录成功，Set-Cookie 下发会话
        "400":
          description: 请求格式错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: 用户名或密码错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: 本站已关闭密码登录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/logout:
    post:
      operationId: logout
      summary: 登出，销毁当前会话
      tags: [auth]
      responses:
        "204":
          description: 已登出（无论此前是否持有有效会话）
  /auth/me:
    get:
      operationId: getCurrentUser
      summary: 获取当前登录用户（含角色与模块权限）
      tags: [auth]
      responses:
        "200":
          description: 当前用户信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/password:
    put:
      operationId: changeOwnPassword
      summary: 修改自己的密码（需验证当前密码，成功后注销其他会话）
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: 修改成功
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/methods:
    get:
      operationId: getAuthMethods
      summary: 查询本站启用了哪些登录方式（登录页据此渲染，无需鉴权）
      tags: [auth]
      responses:
        "200":
          description: 可用登录方式
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMethods"
  /auth/feishu/authorize:
    get:
      operationId: feishuAuthorize
      summary: 跳转飞书授权页（下发一次性 state Cookie 防 CSRF）
      description: 浏览器直接导航到此地址，不要用 fetch 调用。
      tags: [auth]
      parameters:
        - name: next
          in: query
          schema:
            type: string
          description: >
            登录成功后要回到的站内路径（如 /quality/abc）。只接受以单个 / 开头的相对路径，
            其余一律忽略并回落到首页——防开放重定向。
      responses:
        "302":
          description: 重定向到飞书授权页
        "503":
          description: 未配置飞书登录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/feishu/callback:
    get:
      operationId: feishuCallback
      summary: 飞书授权回调：换取用户身份、建立会话后跳回首页
      description: 由飞书授权页重定向而来，地址须与开放平台「安全设置」登记的重定向 URL 完全一致。
      tags: [auth]
      parameters:
        - name: code
          in: query
          schema:
            type: string
          description: 授权码，5 分钟有效且仅可用一次
        - name: state
          in: query
          schema:
            type: string
          description: 发起授权时下发的一次性随机串
        - name: error
          in: query
          schema:
            type: string
          description: 用户取消授权等失败场景由飞书回传
      responses:
        "302":
          description: 成功跳首页并 Set-Cookie 建立会话；失败跳 /login 并在 query 带错误原因
  /users:
    get:
      operationId: listUsers
      summary: 用户列表（需 users 权限）
      tags: [users]
      responses:
        "200":
          description: 全部用户
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createUser
      summary: 创建用户（需 users 权限；不开放注册，账号只能在此创建）
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: 用户名已存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /users/{id}:
    patch:
      operationId: updateUser
      summary: 修改用户角色或重置密码（需 users 权限；不能改自己的角色）
      tags: [users]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: 修改后的用户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteUser
      summary: 删除用户（需 users 权限；不能删除自己）
      tags: [users]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: 删除成功
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /roles:
    get:
      operationId: listRoles
      summary: 角色列表（需 users 权限）
      tags: [roles]
      responses:
        "200":
          description: 全部角色
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createRole
      summary: 创建角色（需 users 权限）
      tags: [roles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleCreate"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: 角色名已存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /roles/{id}:
    patch:
      operationId: updateRole
      summary: 修改角色名或权限（需 users 权限；内置角色不可修改）
      tags: [roles]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleUpdate"
      responses:
        "200":
          description: 修改后的角色
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteRole
      summary: 删除角色（需 users 权限；内置角色与仍被使用的角色不可删除）
      tags: [roles]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: 删除成功
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 角色仍被用户使用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /channels:
    get:
      operationId: listChannels
      summary: 渠道列表（需 channels 权限）
      tags: [channels]
      responses:
        "200":
          description: 全部渠道（含停用的，不含模型明细）
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Channel"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createChannel
      summary: 创建渠道（需 channels 权限；模型条目建完后在详情页添加）
      tags: [channels]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelCreate"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: 渠道名已存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /channels/{id}:
    get:
      operationId: getChannel
      summary: 渠道详情（需 channels 权限；含模型条目列表）
      tags: [channels]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: 渠道详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateChannel
      summary: 修改渠道基本信息（需 channels 权限；apiKey 缺省=不改、给值=覆盖，写后不可回读）
      tags: [channels]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelUpdate"
      responses:
        "200":
          description: 修改后的渠道
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 渠道名已存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteChannel
      summary: 删除渠道（需 channels 权限；硬删，历史任务持有参数快照不受影响，key 不可恢复）
      tags: [channels]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: 删除成功（连同其模型条目）
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /channels/{id}/models:
    post:
      operationId: addChannelModel
      summary: 添加模型条目（需 channels 权限）
      tags: [channels]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelEntryUpsert"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 该渠道下模型名已存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /channels/{id}/models/{modelId}:
    put:
      operationId: updateChannelModel
      summary: 全量替换模型条目（需 channels 权限；缺省的价格字段即清空为未定价）
      tags: [channels]
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/ModelIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelEntryUpsert"
      responses:
        "200":
          description: 替换后的模型条目
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 该渠道下模型名已存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteChannelModel
      summary: 删除模型条目（需 channels 权限；历史任务持有参数快照不受影响）
      tags: [channels]
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/ModelIdPath"
      responses:
        "204":
          description: 删除成功
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /channels/{id}/test:
    post:
      operationId: testChannel
      summary: 连通测试（需 channels 权限；对每个已声明协议发 max_tokens=1 最小真实请求，结果落库为该渠道最近一次测试）
      tags: [channels]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectivityTestRequest"
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: 各协议连通结果（上游拒绝/超时也是正常结果，体现在 ok=false）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectivityTest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /channels/{id}/connectivity/history:
    get:
      operationId: getChannelConnectivityHistory
      summary: 连通历史（登录即可；总览延迟曲线数据源，含手动测试与定时探活两种来源）
      tags: [channels]
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - name: hours
          in: query
          description: 回看窗口小时数
          schema:
            type: integer
            minimum: 1
            maximum: 168
            default: 24
      responses:
        "200":
          description: 时间升序的历史点列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ConnectivityHistoryPoint"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /overview/channels:
    get:
      operationId: listOverviewChannels
      summary: 总览渠道卡片（登录即可；渠道基本信息 + 各模型最近终态质量任务得分，得分即时计算不持久化）
      tags: [overview]
      responses:
        "200":
          description: 渠道卡片列表（按创建时间排序）
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/OverviewChannel"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /system/update:
    get:
      operationId: getUpdateStatus
      summary: 检查在线更新（需 system 权限；查询 GitHub 最新 Release）
      tags: [system]
      responses:
        "200":
          description: 当前版本与最新版本信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          description: GitHub API 请求失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /system/update/deploy:
    post:
      operationId: triggerDeploy
      summary: 触发在线更新（需 system 权限；调 GitHub Actions 重新部署指定版本）
      tags: [system]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeployRequest"
      responses:
        "202":
          description: 已触发部署流水线，稍后轮询 /version 确认切换
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          description: GitHub API 请求失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /probes:
    get:
      operationId: listProbes
      summary: 检测项注册表（需 quality 权限；含元数据供发起页勾选）
      tags: [quality]
      responses:
        "200":
          description: 全部已注册检测项
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProbeInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /quality/tasks:
    post:
      operationId: createQualityTask
      summary: 创建质量检测任务（需 quality 权限；创建时快照检测对象参数，入队后由 worker 执行）
      tags: [quality]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QualityTaskCreate"
      responses:
        "201":
          description: 任务已创建并入队
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualityTask"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 渠道已停用或不支持检测项所需协议
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: listQualityTasks
      summary: 质量检测任务历史（需 quality 权限；按创建时间倒序，可按状态/渠道筛选）
      tags: [quality]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: status
          in: query
          description: 按任务状态筛选；缺省不过滤
          schema:
            $ref: "#/components/schemas/TaskStatus"
        - name: channelId
          in: query
          description: 按渠道筛选；缺省不过滤（渠道删除后其任务 channel_id 置空，仅在不过滤时可见）
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 任务列表分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualityTaskList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /quality/tasks/{id}:
    get:
      operationId: getQualityTask
      summary: 任务详情（需 quality 权限；含参数快照与聚合统计）
      tags: [quality]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: 任务详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualityTask"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /quality/tasks/{id}/results:
    get:
      operationId: listQualityTaskResults
      summary: 用例级结果（需 quality 权限；可按判定状态过滤）
      tags: [quality]
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/CaseStatus"
      responses:
        "200":
          description: 用例结果列表（按套件/行号/模式排序）
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QualityCaseResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /quality/tasks/{id}/report:
    get:
      operationId: getQualityTaskReport
      summary: 评分板（需 quality 权限；检查点加权评分，按当前注册表口径即时计算，仅终态任务可用）
      tags: [quality]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: 评分板
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualityReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 任务尚未结束，暂无评分
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /quality/tasks/{id}/export:
    get:
      operationId: exportQualityTask
      summary: 导出报告（需 quality 权限；json=证据链自足报告，junit=JUnit XML；仅终态任务可用）
      tags: [quality]
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum: [json, junit]
      responses:
        "200":
          description: 报告文件（Content-Disposition attachment）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualityExport"
            application/xml:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 任务尚未结束，暂无报告
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /quality/tasks/{id}/cancel:
    post:
      operationId: cancelQualityTask
      summary: 取消任务（需 quality 权限；排队或运行中的任务可取消，运行中的中止在途请求）
      tags: [quality]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: 取消后的任务
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualityTask"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 任务已结束，不可取消
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /quality/tasks/{id}/events:
    get:
      operationId: streamQualityTaskEvents
      summary: 任务进度事件流（需 quality 权限；SSE，连接后先推当前快照，任务终态后关闭）
      tags: [quality]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: text/event-stream，每帧 data 为 TaskProgressEvent 的 JSON
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /stability/probes:
    get:
      operationId: listStabilityProbes
      summary: 稳定性检测项注册表（需 stability 权限；产出性能指标，无评分检查点）
      tags: [stability]
      responses:
        "200":
          description: 全部已注册稳定性检测项
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StabilityProbeInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /stability/tasks:
    post:
      operationId: createStabilityTask
      summary: 创建稳定性检测任务（需 stability 权限；创建时快照检测对象+协议，入队后由 worker 发压）
      tags: [stability]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StabilityTaskCreate"
      responses:
        "201":
          description: 任务已创建并入队
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StabilityTask"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 渠道已停用或不支持所选协议
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: listStabilityTasks
      summary: 稳定性检测任务历史（需 stability 权限；按创建时间倒序，可按状态/渠道筛选）
      tags: [stability]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: status
          in: query
          description: 按任务状态筛选；缺省不过滤
          schema:
            $ref: "#/components/schemas/TaskStatus"
        - name: channelId
          in: query
          description: 按渠道筛选；缺省不过滤（渠道删除后其任务 channel_id 置空，仅在不过滤时可见）
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 任务列表分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StabilityTaskList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /stability/tasks/{id}:
    get:
      operationId: getStabilityTask
      summary: 稳定性任务详情（需 stability 权限；含参数快照）
      tags: [stability]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: 任务详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StabilityTask"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /stability/tasks/{id}/metrics:
    get:
      operationId: getStabilityTaskMetrics
      summary: 稳定性指标报告（需 stability 权限；档级+overall 聚合，仅终态任务可用）
      tags: [stability]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: 指标报告
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StabilityReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 任务尚未结束，暂无指标报告
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /stability/tasks/{id}/export:
    get:
      operationId: exportStabilityTask
      summary: 导出稳定性报告（需 stability 权限；json=证据链自足报告，含全量逐请求样本；仅终态任务可用）
      tags: [stability]
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum: [json]
      responses:
        "200":
          description: 报告文件（Content-Disposition attachment）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StabilityExport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 任务尚未结束，暂无报告
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /stability/tasks/{id}/cancel:
    post:
      operationId: cancelStabilityTask
      summary: 取消稳定性任务（需 stability 权限；排队或运行中的任务可取消，运行中的中止在途请求）
      tags: [stability]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: 取消后的任务
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StabilityTask"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 任务已结束，不可取消
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /stability/tasks/{id}/events:
    get:
      operationId: streamStabilityTaskEvents
      summary: 稳定性任务进度事件流（需 stability 权限；SSE，连接后先推当前快照，任务终态后关闭）
      tags: [stability]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: text/event-stream，每帧 data 为 TaskProgressEvent 的 JSON
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ModelIdPath:
      name: modelId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: 请求非法
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: 未登录或会话已过期
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: 无权访问该模块
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    VersionInfo:
      type: object
      required: [version]
      properties:
        version:
          type: string
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
        newPassword:
          type: string
          minLength: 8
    PermissionMap:
      description: 粗粒度模块权限开关：控制对应页面与该模块全部接口的访问
      type: object
      required: [channels, quality, stability, users, system]
      properties:
        channels:
          type: boolean
        quality:
          type: boolean
        stability:
          type: boolean
        users:
          type: boolean
        system:
          type: boolean
    CurrentUser:
      type: object
      required: [id, username, role, permissions]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
          nullable: true
          description: 飞书账号的姓名，密码账号为空
        avatarUrl:
          type: string
          nullable: true
          description: 飞书头像地址，密码账号为空
        role:
          type: string
        permissions:
          $ref: "#/components/schemas/PermissionMap"
    AuthMethods:
      description: 登录页据此决定渲染哪些入口
      type: object
      required: [password, feishu]
      properties:
        password:
          type: boolean
          description: 是否保留用户名密码登录（管理员兜底通道）
        feishu:
          type: boolean
          description: 是否已配置飞书 OAuth 登录
    AuthSource:
      type: string
      enum: [password, feishu]
    User:
      type: object
      required: [id, username, roleId, roleName, authSource, createdAt]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        roleId:
          type: string
          format: uuid
        roleName:
          type: string
        authSource:
          $ref: "#/components/schemas/AuthSource"
        createdAt:
          type: string
          format: date-time
    UserCreate:
      type: object
      required: [username, password, roleId]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 8
        roleId:
          type: string
          format: uuid
    UserUpdate:
      type: object
      properties:
        roleId:
          type: string
          format: uuid
        password:
          type: string
          minLength: 8
    Role:
      type: object
      required: [id, name, builtIn, permissions]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        builtIn:
          type: boolean
        permissions:
          $ref: "#/components/schemas/PermissionMap"
    RoleCreate:
      type: object
      required: [name, permissions]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        permissions:
          $ref: "#/components/schemas/PermissionMap"
    RoleUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        permissions:
          $ref: "#/components/schemas/PermissionMap"
    UpdateStatus:
      type: object
      required: [currentVersion, tokenConfigured, updateAvailable]
      properties:
        currentVersion:
          type: string
        tokenConfigured:
          description: 服务器是否配置了 GitHub Token（未配置时无法检查/触发更新）
          type: boolean
        updateAvailable:
          type: boolean
        latestVersion:
          type: string
        releaseNotes:
          type: string
        publishedAt:
          type: string
          format: date-time
    DeployRequest:
      type: object
      required: [tag]
      properties:
        tag:
          description: 要部署的版本 tag（须是已存在的 GitHub Release）
          type: string
          pattern: "^v[0-9][A-Za-z0-9.+~-]*$"
    Protocol:
      description: 渠道支持的接口协议
      type: string
      enum: [openai_chat, openai_responses, anthropic_messages]
    Currency:
      description: 渠道定价币种（仅标注，不做汇率换算）
      type: string
      enum: [USD, CNY]
    Channel:
      type: object
      required:
        [id, name, baseUrl, keyPrefix, protocols, currency, note, disabled, modelCount, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        baseUrl:
          description: 填到版本段（如 https://api.example.com/v1），平台按协议拼固定末段
          type: string
        keyPrefix:
          description: API key 脱敏前缀（key 写后不可回读）
          type: string
        protocols:
          type: array
          items:
            $ref: "#/components/schemas/Protocol"
        currency:
          $ref: "#/components/schemas/Currency"
        note:
          type: string
        disabled:
          description: 停用后不可选入新检测任务，配置与 key 保留
          type: boolean
        modelCount:
          type: integer
        lastTest:
          $ref: "#/components/schemas/ConnectivityTest"
        probeIntervalMinutes:
          description: 定时探活间隔分钟（1-1440）；缺省=未开启
          type: integer
          minimum: 1
          maximum: 1440
        probeModelId:
          description: 定时探活用的模型条目；条目被删自动置空、调度停摆
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
    ChannelDetail:
      allOf:
        - $ref: "#/components/schemas/Channel"
        - type: object
          required: [models]
          properties:
            models:
              type: array
              items:
                $ref: "#/components/schemas/ModelEntry"
    ChannelCreate:
      type: object
      required: [name, baseUrl, apiKey, protocols]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        baseUrl:
          description: 填到版本段（如 https://api.example.com/v1），末尾斜杠会被自动去除
          type: string
          minLength: 1
          maxLength: 512
        apiKey:
          type: string
          minLength: 1
        protocols:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Protocol"
        currency:
          $ref: "#/components/schemas/Currency"
        note:
          type: string
          maxLength: 500
    ChannelUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        baseUrl:
          type: string
          minLength: 1
          maxLength: 512
        apiKey:
          description: 缺省=不改；给值=整体覆盖
          type: string
          minLength: 1
        protocols:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Protocol"
        currency:
          $ref: "#/components/schemas/Currency"
        note:
          type: string
          maxLength: 500
        disabled:
          type: boolean
        probeIntervalMinutes:
          description: 定时探活间隔分钟；须与 probeModelId 成对提交整体覆盖，0=关闭（coalesce 语义写不了 null，故用 0 哨兵）
          type: integer
          minimum: 0
          maximum: 1440
        probeModelId:
          description: 定时探活模型条目（须属本渠道）；probeIntervalMinutes=0 时可缺省
          type: string
          format: uuid
    ModelEntry:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        inputPrice:
          description: 每 1M token 输入单价（币种见渠道）；三个价格字段全缺省=未定价
          type: number
        outputPrice:
          type: number
        cachedInputPrice:
          type: number
        createdAt:
          type: string
          format: date-time
    ModelEntryUpsert:
      description: 输入/输出价须成对出现；缓存读价只能在前两者存在时给出（服务端校验）
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        inputPrice:
          type: number
          minimum: 0
        outputPrice:
          type: number
          minimum: 0
        cachedInputPrice:
          type: number
          minimum: 0
    ConnectivityTestRequest:
      type: object
      required: [modelId]
      properties:
        modelId:
          description: 用哪个模型条目发探测请求
          type: string
          format: uuid
    ConnectivityTest:
      type: object
      required: [testedAt, model, results]
      properties:
        testedAt:
          type: string
          format: date-time
        model:
          description: 当时用于探测的模型名（快照，不随模型条目改名变化）
          type: string
        results:
          type: array
          items:
            $ref: "#/components/schemas/ConnectivityResult"
    ConnectivityResult:
      type: object
      required: [protocol, ok]
      properties:
        protocol:
          $ref: "#/components/schemas/Protocol"
        ok:
          type: boolean
        status:
          description: 上游 HTTP 状态码（网络层失败时缺省）
          type: integer
        ttftMs:
          description: 首字延迟毫秒（流式首个数据帧到达；失败时缺省）
          type: integer
        error:
          description: 失败摘要（超时/连接错误/上游错误体截断）
          type: string
    ConnectivitySource:
      description: 探测来源：manual=手动测试、scheduled=定时探活
      type: string
      enum: [manual, scheduled]
    ConnectivityHistoryPoint:
      description: 连通历史点：一行=（一次测试 × 一协议），同次测试各协议行 testedAt 严格一致，前端按其分组还原一次测试
      type: object
      required: [testedAt, model, source, protocol, ok]
      properties:
        testedAt:
          type: string
          format: date-time
        model:
          description: 当时探测用的模型名快照
          type: string
        source:
          $ref: "#/components/schemas/ConnectivitySource"
        protocol:
          $ref: "#/components/schemas/Protocol"
        ok:
          type: boolean
        ttftMs:
          description: 首字延迟毫秒；失败时缺省（曲线在此断点留白）
          type: integer
    OverviewModelScore:
      description: 总览卡片单模型得分行：该渠道 × 模型名快照的最近一个终态质量任务即时计算；taskStatus 非 succeeded 时得分基于不完整采样，前端须挂状态标注
      type: object
      required: [model, taskId, taskStatus]
      properties:
        model:
          description: 模型名快照（与任务快照、连通历史同口径）
          type: string
        modelEntryId:
          description: 任务快照里的模型条目 id（老任务缺省；用于匹配默认探活模型）
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
        taskStatus:
          $ref: "#/components/schemas/TaskStatus"
        finishedAt:
          type: string
          format: date-time
        score:
          description: 总分 0-100，口径与任务报告一致；无已采样检查点时缺省
          type: number
    OverviewChannel:
      allOf:
        - $ref: "#/components/schemas/Channel"
        - type: object
          required: [models]
          properties:
            models:
              description: 有终态质量任务的模型得分行（按模型名去重取最近一次）
              type: array
              items:
                $ref: "#/components/schemas/OverviewModelScore"
    ProbeInfo:
      type: object
      required: [id, name, description, protocols, needsControl, needsPricing, caseCount, requestsPerCase, supportsMaxCases]
      properties:
        id:
          description: 检测项唯一标识（如 tool_call_json_schema）
          type: string
        name:
          description: 中文显示名
          type: string
        description:
          type: string
        protocols:
          description: 适用协议（渠道须至少声明其中之一）
          type: array
          items:
            $ref: "#/components/schemas/Protocol"
        needsControl:
          description: 是否需要对照渠道
          type: boolean
        needsPricing:
          description: 是否要求目标模型已定价
          type: boolean
        caseCount:
          description: 全量用例数
          type: integer
        requestsPerCase:
          description: 每用例请求数（如 toolschema 非流式+流式各一次 = 2），用于前端估算请求量
          type: integer
        supportsMaxCases:
          description: 是否受任务参数「用例数上限」影响（固定请求矩阵的检测项为 false）
          type: boolean
    TaskStatus:
      type: string
      enum: [queued, running, succeeded, failed, canceled]
    CaseStatus:
      description: 用例判定：rejected=请求被上游拒绝（HTTP/传输错误）；violated=响应到手但不合规；passed=合规；collected=已采集·待评估（跨行断言检测项运行中的中间态，只含原始计数不含结论，任务结束后必被终态覆盖）
      type: string
      enum: [passed, rejected, violated, collected]
    CaseMode:
      type: string
      enum: [non_stream, stream]
    QualityTaskParams:
      type: object
      properties:
        concurrency:
          description: 任务内请求并发数
          type: integer
          minimum: 1
          maximum: 16
          default: 4
        reruns:
          description: 失败用例重跑轮数（末次结果为准）
          type: integer
          minimum: 0
          maximum: 5
          default: 2
        maxCases:
          description: 用例数上限（缺省=全量；超过检测项全量数时按全量算）
          type: integer
          minimum: 1
    QualityTaskCreate:
      type: object
      required: [channelId, modelEntryId, probes]
      properties:
        channelId:
          type: string
          format: uuid
        modelEntryId:
          type: string
          format: uuid
        probes:
          description: 勾选的检测项 id 集合
          type: array
          minItems: 1
          items:
            type: string
        params:
          $ref: "#/components/schemas/QualityTaskParams"
    TaskTarget:
      description: 检测对象参数快照（任务创建时定格，不受渠道后续编辑/删除影响；绝不含 API key）
      type: object
      required: [channelName, baseUrl, model, protocols]
      properties:
        channelId:
          description: 原渠道 id（渠道被删后仅作历史参考）
          type: string
          format: uuid
        channelName:
          type: string
        baseUrl:
          type: string
        modelEntryId:
          type: string
          format: uuid
        model:
          type: string
        protocols:
          type: array
          items:
            $ref: "#/components/schemas/Protocol"
        currency:
          $ref: "#/components/schemas/Currency"
        inputPrice:
          type: number
        outputPrice:
          type: number
        cachedInputPrice:
          type: number
    TaskStatBucket:
      type: object
      required: [name, total, passed, rejected, violated, collected]
      properties:
        name:
          type: string
        total:
          type: integer
        passed:
          type: integer
        rejected:
          type: integer
        violated:
          type: integer
        collected:
          description: 已采集·待评估行数（仅运行中非零）
          type: integer
    TaskStats:
      type: object
      required: [total, passed, rejected, violated, collected, byMode, byReason]
      properties:
        total:
          type: integer
        passed:
          type: integer
        rejected:
          type: integer
        violated:
          type: integer
        collected:
          description: 已采集·待评估行数（仅运行中非零）
          type: integer
        byMode:
          type: array
          items:
            $ref: "#/components/schemas/TaskStatBucket"
        byReason:
          description: 按选例理由（selection_reason）分桶
          type: array
          items:
            $ref: "#/components/schemas/TaskStatBucket"
    QualityTask:
      type: object
      required: [id, status, target, probes, params, progressTotal, progressDone, createdAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/TaskStatus"
        target:
          $ref: "#/components/schemas/TaskTarget"
        probes:
          type: array
          items:
            type: string
        params:
          description: 生效参数（缺省项已填入默认值）
          $ref: "#/components/schemas/QualityTaskParams"
        progressTotal:
          type: integer
        progressDone:
          type: integer
        error:
          description: 任务级失败原因（用例级失败不算任务失败）
          type: string
        createdBy:
          description: 创建者用户名（用户被删后缺省）
          type: string
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        stats:
          description: 聚合统计（仅详情接口返回，任务未产生结果时缺省）
          $ref: "#/components/schemas/TaskStats"
        score:
          description: 总分 0-100；仅列表接口对终态任务返回，按当前检查点注册表口径即时计算、绝不持久化；排队/运行中或无已采样检查点时缺省
          type: number
    QualityTaskList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/QualityTask"
        total:
          type: integer
    QualityCaseResult:
      type: object
      required: [probe, suite, line, mode, selectionReason, status, message, attempts]
      properties:
        probe:
          type: string
        suite:
          description: 语料套件名（如 TestEnforcerCases）
          type: string
        line:
          description: 套件内行号（1 起，与 KVV 官方报告对齐）
          type: integer
        mode:
          $ref: "#/components/schemas/CaseMode"
        selectionReason:
          type: string
        status:
          $ref: "#/components/schemas/CaseStatus"
        message:
          description: 失败摘要（校验错误/上游错误体截断；通过时为空）
          type: string
        httpStatus:
          type: integer
        latencyMs:
          type: integer
        arguments:
          description: 模型最终产出的工具参数原文（截断存储）
          type: string
        attempts:
          type: integer
    CheckpointScore:
      description: 一个评分检查点的聚合结果；得分 = passed/total × 100（rejected 与 violated 均计失败）
      type: object
      required: [id, name, weight, total, passed, rejected, violated]
      properties:
        id:
          description: 检查点稳定标识（检测项元数据声明）
          type: string
        name:
          type: string
        weight:
          description: 同一检测项内的相对权重
          type: number
        total:
          type: integer
        passed:
          type: integer
        rejected:
          type: integer
        violated:
          type: integer
        score:
          description: 0-100；未采样（total=0，如被用例上限截掉）时缺省且不参与加权
          type: number
    ProbeScore:
      type: object
      required: [probeId, probeName, checkpoints]
      properties:
        probeId:
          type: string
        probeName:
          description: 检测项中文名（快照自注册表；检测项已下架时回退为 id）
          type: string
        score:
          description: 检查点加权平均（0-100）；全部检查点未采样时缺省
          type: number
        checkpoints:
          type: array
          items:
            $ref: "#/components/schemas/CheckpointScore"
    QualityReport:
      description: 评分板：按「检查点 + 权重」模型即时计算——检查点得分=命中用例通过占比，检测项得分=检查点加权平均，总分=各检测项等权平均。原始判定以用例级结果为准，评分是其视图。
      type: object
      required: [taskId, status, probes, generatedAt]
      properties:
        taskId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/TaskStatus"
        score:
          description: 总分 0-100；无任何已采样检查点时缺省
          type: number
        incomplete:
          description: 任务非正常结束（failed/canceled），评分仅基于已采集数据
          type: boolean
        probes:
          type: array
          items:
            $ref: "#/components/schemas/ProbeScore"
        generatedAt:
          type: string
          format: date-time
    QualityExport:
      description: 证据链自足的 JSON 导出：任务快照 + 评分板 + 全量用例级结果，脱离平台可独立审计
      type: object
      required: [tool, version, task, report, results]
      properties:
        tool:
          description: 固定 "assay"
          type: string
        version:
          description: 导出时服务端版本
          type: string
        task:
          $ref: "#/components/schemas/QualityTask"
        report:
          $ref: "#/components/schemas/QualityReport"
        results:
          type: array
          items:
            $ref: "#/components/schemas/QualityCaseResult"
    TaskProgressEvent:
      description: SSE data 帧载荷
      type: object
      required: [taskId, status, done, total]
      properties:
        taskId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/TaskStatus"
        done:
          type: integer
        total:
          type: integer
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    StabilityProbeInfo:
      description: 稳定性检测项元数据（产出性能指标，无评分检查点）
      type: object
      required: [id, name, description, protocols, estRequests]
      properties:
        id:
          description: 检测项唯一标识（如 concurrency_ladder）
          type: string
        name:
          type: string
        description:
          type: string
        protocols:
          description: 适用协议（空=全适用，前端展示为三协议皆可）
          type: array
          items:
            $ref: "#/components/schemas/Protocol"
        estRequests:
          description: 按默认参数的最坏预估请求数（前端据实选参数自行重算展示）
          type: integer
    StabilityTaskParams:
      description: 稳定性任务参数：实选协议 + 各 probe 档位 + 全局成本硬闸
      type: object
      properties:
        protocol:
          description: 本任务实选协议（写入快照；须为渠道声明协议之一）
          $ref: "#/components/schemas/Protocol"
        concurrencyLadder:
          description: 阶梯并发的并发档序列（闭环）
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 512
          default: [1, 2, 4, 8, 16]
        requestsPerStage:
          description: 每档计入统计的请求数
          type: integer
          minimum: 1
          maximum: 1000
          default: 20
        warmupPerStage:
          description: 每档预热请求数（评估时剔除，不计入指标）；缺省 0（不预热）
          type: integer
          minimum: 0
          maximum: 100
          default: 0
        ladderMaxTokens:
          description: 每请求生成上限（max_tokens 砝码，控制单请求耗时与成本）
          type: integer
          minimum: 1
          maximum: 4096
          default: 64
        rpmStartRate:
          description: RPM 实测起始到达率（req/s，开环）
          type: number
          minimum: 0.1
          maximum: 1000
          default: 2
        rpmMaxRate:
          description: RPM 探测速率护栏上限（req/s）；升到此仍不限速则报「边界≥上限」
          type: number
          minimum: 0.1
          maximum: 1000
          default: 20
        rpmStageSec:
          description: RPM 每档发压时长（秒）；前一半为热身（消化渠道残留计数/突发额度），只用后一半判限速
          type: integer
          minimum: 2
          maximum: 600
          default: 120
        rpmMaxInFlight:
          description: RPM 在途请求上限（防雪崩兜底）
          type: integer
          minimum: 1
          maximum: 4096
          default: 128
        rpmMaxTokens:
          description: RPM 每请求生成上限（只关心请求速率，取小）
          type: integer
          minimum: 1
          maximum: 4096
          default: 16
        rpmLimitThreshold:
          description: 判定某档触发限速的 429 占比阈值（0-1）
          type: number
          minimum: 0.01
          maximum: 1
          default: 0.1
        rpmBinarySteps:
          description: 找到限速档后二分细化真实边界的步数
          type: integer
          minimum: 0
          maximum: 12
          default: 4
        tpmStartRate:
          description: TPM 实测起始 token 到达率（token/s，开环；换算请求速率发压）
          type: number
          minimum: 1
          maximum: 1000000
          default: 200
        tpmMaxRate:
          description: TPM 探测 token 速率护栏上限（token/s）；升到此仍不限速则报「边界≥上限」
          type: number
          minimum: 1
          maximum: 1000000
          default: 2000
        tpmStageSec:
          description: TPM 每档发压时长（秒）；前一半为热身，只用后一半判限速
          type: integer
          minimum: 2
          maximum: 600
          default: 120
        tpmMaxInFlight:
          description: TPM 在途请求上限（防雪崩兜底）
          type: integer
          minimum: 1
          maximum: 4096
          default: 128
        tpmMaxTokensPerReq:
          description: TPM 每请求 max_tokens 砝码（顶格数数 prompt 保证打满输出；输入+输出都计）
          type: integer
          minimum: 1
          maximum: 8192
          default: 256
        tpmLimitThreshold:
          description: 判定某档触发限速的 429 占比阈值（0-1）
          type: number
          minimum: 0.01
          maximum: 1
          default: 0.1
        tpmBinarySteps:
          description: 找到限速档后二分细化真实 token 速率边界的步数
          type: integer
          minimum: 0
          maximum: 12
          default: 4
        maxTotalRequests:
          description: 全局请求硬闸；累计达到即收敛停止
          type: integer
          minimum: 1
          default: 10000
        maxTotalTokens:
          description: 全局 token 硬闸；累计达到即收敛停止
          type: integer
          minimum: 1
          default: 2000000
        maxDurationSec:
          description: 整任务墙钟上限（秒）；到点停派新请求、在途的跑完，已出结果照常出报告并标截断
          type: integer
          minimum: 60
          maximum: 7200
          default: 3600
        requestTimeoutMs:
          description: 单请求超时（毫秒）
          type: integer
          minimum: 1000
          maximum: 600000
          default: 60000
    StabilityTaskCreate:
      type: object
      required: [channelId, modelEntryId, probes, params]
      properties:
        channelId:
          type: string
          format: uuid
        modelEntryId:
          type: string
          format: uuid
        probes:
          description: 勾选的稳定性检测项 id 集合
          type: array
          minItems: 1
          items:
            type: string
        params:
          $ref: "#/components/schemas/StabilityTaskParams"
    StabilityTask:
      type: object
      required: [id, status, target, probes, params, progressTotal, progressDone, createdAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/TaskStatus"
        target:
          $ref: "#/components/schemas/TaskTarget"
        probes:
          type: array
          items:
            type: string
        params:
          description: 生效参数（缺省项已填入默认值）
          $ref: "#/components/schemas/StabilityTaskParams"
        progressTotal:
          type: integer
        progressDone:
          type: integer
        error:
          type: string
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
    StabilityTaskList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/StabilityTask"
        total:
          type: integer
    StabilityPercentiles:
      description: 一组延迟观测的分位数摘要（评估期确定性计算，单位毫秒）
      type: object
      required: [p50, p95, p99, min, max, avg]
      properties:
        p50:
          type: integer
        p95:
          type: integer
        p99:
          type: integer
        min:
          type: integer
        max:
          type: integer
        avg:
          type: number
    StabilityMetrics:
      description: 一个（probe×档位）的指标集
      type: object
      required: [requests, errors, errorRate]
      properties:
        requests:
          description: 计入统计的请求数（已剔除预热）
          type: integer
        errors:
          type: integer
        errorRate:
          type: number
        ttftMs:
          $ref: "#/components/schemas/StabilityPercentiles"
        ttfdMs:
          description: 首个非空增量（推理或正文）耗时分位；推理模型「开始干活」的时刻，非推理模型≈TTFT
          allOf:
            - $ref: "#/components/schemas/StabilityPercentiles"
        ttfbMs:
          $ref: "#/components/schemas/StabilityPercentiles"
        totalMs:
          $ref: "#/components/schemas/StabilityPercentiles"
        budgetExhausted:
          description: 生成上限被推理耗尽仍无正文的条数；不计入 errors/errorRate（砝码不足非渠道故障），>0 即 TTFT 结论不可用
          type: integer
        cacheHits:
          description: 输入命中缓存的成功条数；不计入延迟分位
          type: integer
        throughputRps:
          description: 达成吞吐（请求/秒，按样本时间窗计）
          type: number
        tokensPerSec:
          description: 输出 token 吞吐（token/秒）
          type: number
        byErrorClass:
          description: 各错误分类计数
          type: object
          additionalProperties:
            type: integer
        concurrency:
          description: 阶梯并发档的并发数（其它 probe 缺省）
          type: integer
        targetRate:
          description: 开环档目标到达率（req/s）
          type: number
        achievedRate:
          description: 开环档实际达成到达率（req/s，在途封顶会低于目标）
          type: number
        rateLimited:
          description: 开环档 429 占比是否判定为触发限速
          type: boolean
        convergedRpm:
          description: __overall__ RPM 收敛的可持续边界（请求/分钟）
          type: number
        reachedCap:
          description: __overall__ 探到速率护栏顶仍未限速（真实边界≥护栏）
          type: boolean
        truncated:
          description: __overall__ RPM/TPM 搜索被全局硬闸截断；未出现限速档时收敛值只是下界，出现过则二分未完成
          type: boolean
        truncatedBy:
          description: __overall__ 先触发的硬闸
          type: string
          enum: [requests, tokens, duration]
        targetTokenRate:
          description: TPM 开环档目标 token 到达率（token/s）
          type: number
        achievedTokenRate:
          description: TPM 开环档实测 token 吞吐（token/s，输入+输出都计）
          type: number
        convergedTpm:
          description: __overall__ TPM 收敛的可持续边界（token/分钟）
          type: number
        rateLimitHeaders:
          description: 最近一次响应携带的限速头快照（x-ratelimit-*/anthropic-ratelimit-*/retry-after）
          type: object
          additionalProperties:
            type: string
    StabilityStageMetric:
      description: 一档（或 __overall__ probe 级）的评估结果
      type: object
      required: [probe, stage, stageIndex, metrics]
      properties:
        probe:
          type: string
        stage:
          description: 档位标识；__overall__ 为 probe 级汇总
          type: string
        stageIndex:
          description: 档序号；__overall__ 为 -1
          type: integer
        metrics:
          $ref: "#/components/schemas/StabilityMetrics"
    StabilityReport:
      description: 稳定性指标报告：档级 + overall 聚合，口径见 footnotes
      type: object
      required: [taskId, status, protocol, stages, generatedAt]
      properties:
        taskId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/TaskStatus"
        protocol:
          $ref: "#/components/schemas/Protocol"
        incomplete:
          description: 任务非正常结束（failed/canceled），指标仅基于已采集样本
          type: boolean
        stages:
          type: array
          items:
            $ref: "#/components/schemas/StabilityStageMetric"
        footnotes:
          description: 测量口径脚注（TTFT 起点、预热剔除、分位数算法等）
          type: array
          items:
            type: string
        generatedAt:
          type: string
          format: date-time
    StabilitySample:
      description: 一次压测请求的逐请求原始时序（证据链源；失败样本延迟/计量字段缺省）
      type: object
      required: [probe, stage, stageIndex, seq, protocol, dispatchedAt, ok, warmup]
      properties:
        probe:
          type: string
        stage:
          type: string
        stageIndex:
          type: integer
        seq:
          type: integer
        protocol:
          $ref: "#/components/schemas/Protocol"
        dispatchedAt:
          type: string
          format: date-time
        ok:
          type: boolean
        httpStatus:
          type: integer
        errorClass:
          type: string
        error:
          type: string
        httpProto:
          description: 实际协商的协议版本（如 HTTP/1.1）
          type: string
        ttfbMs:
          type: integer
        ttfdMs:
          description: 首个非空增量（推理或正文）耗时
          type: integer
        ttftMs:
          type: integer
        totalMs:
          type: integer
        inputTokens:
          type: integer
        outputTokens:
          type: integer
        cachedTokens:
          description: 输入中命中缓存的 token 数
          type: integer
        warmup:
          type: boolean
    StabilityExport:
      description: 证据链自足的 JSON 导出：任务快照 + 指标报告 + 全量逐请求样本
      type: object
      required: [tool, version, task, report, samples]
      properties:
        tool:
          type: string
        version:
          type: string
        task:
          $ref: "#/components/schemas/StabilityTask"
        report:
          $ref: "#/components/schemas/StabilityReport"
        samples:
          type: array
          items:
            $ref: "#/components/schemas/StabilitySample"
